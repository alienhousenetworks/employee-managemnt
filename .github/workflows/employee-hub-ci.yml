name: Employee Hub CI
permissions:
  contents: write
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/employee_hub_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android,ios
      - name: Commit generated Android and iOS runners
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        shell: bash
        run: |
          git add -A .
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: add generated Flutter platform runners [skip ci]'
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: flutter pub get
      - run: dart format lib
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q alienhouse_employee_hub scripts
      - run: python -m pip install -r requirements.txt
